name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  # Lets npm exchange this job's GitHub OIDC token for a short-lived publish token
  # (trusted publishing) and sign the provenance attestation
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer. Pinned to the npm 11 line so a
      # new npm major version cannot change release behaviour unexpectedly.
      - name: Update npm
        run: |
          npm install -g npm@11
          npm --version

      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint, format check, typecheck, and test
        run: npm run check

      - name: Build
        run: npm run build

      - name: Verify the packed tarball
        run: node scripts/verify-package.mjs

      # Authenticates with npm trusted publishing: no npm token or secret is used.
      # Scripts are skipped because the steps above already checked and built dist/.
      - name: Publish
        run: npm publish --provenance --access public --ignore-scripts

      # npm reports trusted-publishing failures only at verbose level, so a failed
      # publish otherwise shows just "ENEEDAUTH". Surface the real reason.
      - name: Show npm trusted publishing errors
        if: failure()
        run: |
          grep -h -E "(silly|verbose|warn) oidc " ~/.npm/_logs/*-debug-0.log \
            || echo "No trusted publishing entries in the npm debug log."
