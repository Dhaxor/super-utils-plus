name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  # Required for npm trusted publishing and provenance attestations
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC) needs npm 11.5.1 or newer
      - name: Update npm
        run: npm install -g npm@latest

      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint, format check, typecheck, and test
        run: npm run check

      - name: Build
        run: npm run build

      - name: Verify the packed tarball
        run: node scripts/verify-package.mjs

      # Scripts are skipped because the steps above already checked and built dist/.
      # Authentication uses trusted publishing when configured on npmjs.com, or the
      # NPM_TOKEN repository secret otherwise.
      - name: Publish
        run: npm publish --provenance --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
